<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QQ 群管理工具</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232F4BFF'/><circle cx='16' cy='13' r='5' fill='white'/><path d='M6 27c1.5-5 5.2-7 10-7s8.5 2 10 7' fill='white'/></svg>" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">Q</div>
        <div class="brand-text">
          <strong>群务工作台</strong>
          <span>NapCat · OneBot v11</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/connect" data-view="connect">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.8 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          <span>连接</span>
        </a>
        <a class="nav-item" href="#/groups" data-view="groups">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg>
          <span>群组</span>
        </a>
        <a class="nav-item" href="#/members" data-view="members">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.7-3.6 3-5.4 6-5.4s5.3 1.8 6 5.4"/><path d="M16 8.5a3 3 0 0 1 0 5.6M17 14.6c2 .6 3.3 2.2 3.7 5"/></svg>
          <span>成员</span>
        </a>
        <a class="nav-item" href="#/cards" data-view="cards">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M4 12h7M4 17h5"/><path d="m15.5 15.5 4.2-4.2a2 2 0 0 0-2.8-2.8l-4.2 4.2-.7 3.5z"/></svg>
          <span>批量改名</span>
        </a>
        <a class="nav-item" href="#/settings" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.2A1.6 1.6 0 0 0 7.5 19a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13.7H2.8a2 2 0 1 1 0-4H3a1.6 1.6 0 0 0 1.1-2.7L4 6.9a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.7 3H10a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.2a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.2.9z"/></svg>
          <span>群设置</span>
        </a>
        <a class="nav-item" href="#/tasks" data-view="tasks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="18.5" cy="18" r="2.5"/></svg>
          <span>任务中心</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <span class="dot dot-idle"></span>
        <span>仅监听本机</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumb">
          <span id="crumb-title">连接</span>
          <span class="crumb-sub" id="crumb-sub"></span>
        </div>
        <div class="topbar-right">
          <div class="status" id="conn-status" title="连接状态">
            <i class="dot dot-idle"></i><span>未连接</span>
          </div>
          <div class="pill" id="self-pill" title="当前登录账号">—</div>
          <div class="pill pill-group" id="group-pill" title="当前群">未选群</div>
          <button class="btn btn-ghost btn-sm" id="refresh-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
            刷新
          </button>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>
  </div>

  <div class="toast-host" id="toast-host"></div>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-mask" data-close="1"></div>
    <section class="drawer-panel">
      <header class="drawer-head">
        <h2 id="drawer-title">详情</h2>
        <button class="icon-btn" data-close="1" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
      <footer class="drawer-foot" id="drawer-foot"></footer>
    </section>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
