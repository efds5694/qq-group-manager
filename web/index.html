<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="light dark"/>
  <title>群务工作台</title>
  <script>
    // 在样式绘制前恢复主题；完整切换逻辑由 theme.js 管理。
    (() => {
      let theme;
      try { theme = JSON.parse(localStorage.getItem('qqgm.prefs.v1') || '{}')?.theme; } catch {}
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
        ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/theme.css"/>
  <link rel="stylesheet" href="/css/workspace.css"/>
  <link rel="icon" type="image/png" href="/assets/qq.png"/>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark qq-mark" src="/assets/qq.png" width="36" height="36" alt=""/><div class="brand-text"><strong>群务工作台</strong></div></div>
      <nav class="nav" id="nav" aria-label="主导航">
        <a class="nav-item" href="#/groups" data-view="groups"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 14h5"/></svg><span>群聊</span></a>
        <a class="nav-item" href="#/members" data-view="members"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-7 12-7 12 0M17 5a3 3 0 0 1 0 6m1 3c3 1 3 4 3 6"/></svg><span>成员</span></a>
        <a class="nav-item" href="#/lists" data-view="lists"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M8 10l1 1 2-2m2 1h3m-8 6 1 1 2-2m2 1h3"/></svg><span>名单与邀请</span></a>
        <a class="nav-item" href="#/tasks" data-view="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h12M9 12h12M9 19h12m-18-14 1 1 2-3m-3 9 1 1 2-3m-3 9 1 1 2-3"/></svg><span>任务</span></a>
      </nav>
      <div class="sidebar-bottom"><div class="sidebar-session" role="status"><div class="status" id="conn-status"><i class="dot dot-idle"></i><span>未连接</span></div><span id="self-pill">在设置中连接协议端</span></div><a class="nav-item" href="#/preferences" data-view="preferences"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 4 2 3 1 3 4 2 3-1 3-1 2-4-1-3-1-3-4-2z"/></svg><span>设置</span></a></div>
    </aside>
    <div class="main"><main id="view" class="view">
      <div class="page">
        <div id="bootstrap-progress" role="status"><div class="job-strip"><strong>正在启动群务工作台…</strong></div></div>
      </div>
    </main></div>
  </div>
  <div class="toast-host" id="toast-host"></div>
  <div class="drawer" id="drawer" aria-hidden="true"><div class="drawer-mask" data-close="1"></div><section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="drawer-head"><h2 id="drawer-title">资料</h2><button class="icon-btn" data-close="1" aria-label="关闭">×</button></header><div class="drawer-body" id="drawer-body"></div><footer class="drawer-foot" id="drawer-foot"></footer></section></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
