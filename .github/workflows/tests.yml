name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test with standard library only
        run: python -m unittest discover -s tests -v
      - name: Install optional XLSX support
        run: python -m pip install -r requirements-xlsx.txt
      - name: Test including XLSX exports
        run: python -m unittest discover -s tests -v
